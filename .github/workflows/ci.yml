name: CI & Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Package Cove.app
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift Version & Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Build and Package Cove.app
        run: |
          chmod +x ./Scripts/build_app.sh
          ./Scripts/build_app.sh

      - name: Verify Code Signature
        run: |
          codesign -vvv --deep --strict build/Cove.app

      - name: Compress Cove.app to Zip
        run: |
          cd build
          ditto -c -k --keepParent Cove.app Cove.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cove-macOS
          path: build/Cove.zip
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Cove.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
